context:
  name: xeus-octave
  version: 0.2.0

package:
  name: ${{ name }}-wasm
  version: ${{ version }}

source:
  # Note: When using local path, patches are applied from within that directory
  # path: /Users/baibhavbista/Documents/Work/GauntletAI/legacy-projects/xeus-octave
  url: https://github.com/jupyter-xeus/xeus-octave/archive/refs/tags/v${{ version }}.tar.gz
  # The sha256 will be re-calculated on the next build run.
  sha256: 077a3cbf7dab8aeec400ec8f2458b51cb39778c9c6dd41db7fefa702bca7f082
  patches:
    - 0001-changes_since_d6046e5.patch

build:
  number: 4
  # Ensure the build script has proper error handling
  # script_env:
  #   - CMAKE_ARGS

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - cmake
    - make
    - pkg-config
  host:
    # Core dependencies
    - octave ==9.4.0  # This already contains CLAPACK symbols
    - xeus-lite >=3.0.0,<4.0
    - xeus >=5.0.0,<6.0
    - nlohmann_json
    - libpng
    - zlib
    # Dependencies required by Octave
    - pcre2 ==10.45
    - libf2c
    # CLAPACK is needed for headers but MUST NOT be linked directly
    # The build script will hide libclapack_all.a to prevent linking
    - clapack ==3.2.1  # Required for headers only - DO NOT LINK

about:
  homepage: https://github.com/jupyter-xeus/xeus-octave
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: 'A Jupyter kernel for GNU Octave, compiled for WebAssembly.'
  description: |
    xeus-octave is a Jupyter kernel for GNU Octave based on the xeus C++ library.
    This WebAssembly build uses Octave compiled with CLAPACK (f2c-based LAPACK).
    IMPORTANT: CLAPACK symbols are provided through Octave's static libraries,
    not linked directly to avoid duplicate symbol errors.

extra:
  recipe-maintainers:
    - Your Name Here
  notes: |
    Critical build notes:
    - Octave must be built with CLAPACK using f2c calling conventions
    - CLAPACK is included as a dependency for headers only
    - The build script hides libclapack_all.a to prevent direct linking
    - All BLAS/LAPACK symbols are provided through Octave's static libraries
    - Function signature mismatches occur if CLAPACK is linked directly 