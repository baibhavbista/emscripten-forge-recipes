# built in a different repo
context:
  name: octave
  version: 9.4.0

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://ftp.gnu.org/gnu/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: da9481205bfa717660b7d4a16732d8b2d58aadceab4993d41242a8e2848ea6c1
  patches:
    # The gejsv patch is no longer needed as we are building a newer LAPACK from source.
    # - 0004-disable-gejsv.patch
    - 0002-Remove-COMMON.patch
    - 0003-Delete-odepack.patch

build:
  number: 4

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    # f2c is now built from source in build.sh
    # - f2c
    - make
    - curl
    - tar
    - git
    - autoconf
    - automake
    - unzip
    - libtool>=2.5.4
    - pkg-config
    - grep
    - sed
    - perl
    - ghostscript
    - bison
    - gperf
  host:
    # libf2c is now built from source in build.sh
    # - libf2c
    # We no longer use a pre-built clapack. It will be built from source.
    # - clapack
    - pcre2>=10.43
  run_exports:
    - ${{ pin_subpackage('octave', upper_bound='x') }}

about:
  homepage: https://www.gnu.org/software/octave/
  license: GPL-3.0-or-later
  license_file: COPYING
  documentation: https://www.gnu.org/software/octave/doc/interpreter/
  summary: GNU Octave is a high-level language, primarily intended for numerical computations
