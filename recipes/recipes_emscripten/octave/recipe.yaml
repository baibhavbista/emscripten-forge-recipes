context:
  name: octave
  version: 9.4.0

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://ftp.gnu.org/gnu/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: da9481205bfa717660b7d4a16732d8b2d58aadceab4993d41242a8e2848ea6c1
  patches:
    # - 0001-Force-detection-of-shared-libs.patch  # Removed - this forces shared libs which breaks WASM
    - 0002-Remove-COMMON.patch
    - 0003-Delete-odepack.patch

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - f2c  # Native f2c translator tool for build environment
    - make
    - libtool>=2.5.4
    - pkg-config
    - grep
    - sed
    - perl
    - ghostscript
    - bison
    - gperf
  host:
    - libf2c  # WebAssembly f2c runtime library for linking
    - openblas  # F2C-based OpenBLAS instead of openblas-flang
    - pcre2>=10.43
  run_exports:
    - ${{ pin_subpackage('octave', upper_bound='x') }}

about:
  homepage: https://www.gnu.org/software/octave/
  license: GPL-3.0-or-later
  license_file: COPYING
  documentation: https://www.gnu.org/software/octave/doc/interpreter/
  summary: GNU Octave is a high-level language, primarily intended for numerical computations
